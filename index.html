<!DOCTYPE html>
<html lang="en" style="height:100%; width:100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LWC Embed</title>
  <script src="https://lancashiredev--dev.sandbox.my.salesforce.com/lightning/lightning.out.latest/index.iife.prod.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }
    .external-form {
      margin-bottom: 20px;
    }
    .external-form input {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-right: 10px;
      width: 250px;
    }
    .external-form button {
      padding: 8px 16px;
      background-color: #0070d2;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    .external-form button:hover {
      background-color: #005fb2;
    }
    #statusMsg {
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- ✅ Input + Button on external page -->
  <div class="external-form">
    <input type="text" id="personName" placeholder="Enter person name" />
    <button onclick="handleCreateRecord()">Create Record</button>
    <p id="statusMsg"></p>
  </div>

  <lightning-out-application
    id="loApp"
    app-id="1UsPu00000001iTKAQ"
    components="c-lwc-embed-flow">
  </lightning-out-application>

  <c-lwc-embed-flow id="lwcComponent" style="width:101%;"></c-lwc-embed-flow>

  <script>
    // Called when external button is clicked
    function handleCreateRecord() {
      const name = document.getElementById('personName').value.trim();
      const statusMsg = document.getElementById('statusMsg');

      if (!name) {
        statusMsg.style.color = 'red';
        statusMsg.textContent = 'Please enter a name.';
        return;
      }

      const lwcEl = document.getElementById('lwcComponent');

      // Call the exposed method on the LWC
      if (lwcEl && typeof lwcEl.createRecord === 'function') {
        lwcEl.createRecord(name)
          .then(() => {
            statusMsg.style.color = 'green';
            statusMsg.textContent = `Record created for: ${name}`;
            document.getElementById('personName').value = '';
          })
          .catch((err) => {
            statusMsg.style.color = 'red';
            statusMsg.textContent = 'Error: ' + (err.message || 'Something went wrong');
          });
      } else {
        statusMsg.style.color = 'red';
        statusMsg.textContent = 'LWC not ready yet. Please try again.';
      }
    }

    async function init() {
      try {
        const loApp = document.getElementById('loApp');
        const response = await fetch('/api/guest-session');

        if (!response.ok) {
          throw new Error(`Session fetch failed: ${response.status}`);
        }

        const data = await response.json();
        loApp.setAttribute('frontdoor-url', data.frontdoorUrl);
      } catch (err) {
        console.error('Lightning Out init error:', err);
      }
    }

    if (customElements.get('lightning-out-application')) {
      init();
    } else {
      const check = setInterval(() => {
        if (customElements.get('lightning-out-application')) {
          clearInterval(check);
          init();
        }
      }, 100);
    }
  </script>

</body>
</html>
