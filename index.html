<!DOCTYPE html>
<html lang="en" style="height:100%; width: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LWC Embed</title>
  <script src="https://lancashiredev--dev.sandbox.my.salesforce.com/lightning/lightning.out.latest/index.iife.prod.js"></script>
  <style>
  body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  box-sizing: border-box;
  }
  .tabs { display: flex; background: #f5f5f5; border-bottom: 1px solid #ddd; }
  .tab { padding: 10px 16px; cursor: pointer; border: none; background: none; font: inherit; }
  .tab.active { background: #fff; border-top: 3px solid #0070d2; }
  .tab:focus { outline: none; }
  .tab-panel { display: none; height: calc(100% - 44px); }
  .tab-panel.active { display: block; }
  .container { height: 100%; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="container">
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" data-target="tab-flow">Flow</button>
      <button class="tab" role="tab" aria-selected="false" data-target="tab-session">Session Storage</button>
    </div>

    <lightning-out-application
      id="loApp"
      app-id="1UsPu00000001iTKAQ"
      components="c-lwc-embed-flow,c-sessionstorage">
    </lightning-out-application>

    <div id="tab-flow" class="tab-panel active">
      <c-lwc-embed-flow id="flowComp" style="width: 101%; height:100%;"></c-lwc-embed-flow>
    </div>

    <div id="tab-session" class="tab-panel">
      <c-sessionstorage id="sessionStorage" style="width: 101%; height:100%;" ></c-sessionstorage>
    </div>
  </div>
  <script>
    var storename = 'sairam';

    // Tab switching
    function initTabs() {
      document.querySelectorAll('.tab').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.getAttribute('data-target');
          document.querySelectorAll('.tab').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
          btn.classList.add('active'); btn.setAttribute('aria-selected','true');
          document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
          const panel = document.getElementById(target);
          if (panel) panel.classList.add('active');
        });
      });
    }

    async function init() {
      try {
        const flowComp = document.getElementById('flowComp');
        flowComp.name = storename;

        const loApp = document.getElementById('loApp');
        const response = await fetch('/api/guest-session');

        if (!response.ok) {
          throw new Error(`Session fetch failed: ${response.status}`);
        }

        const data = await response.json();
        loApp.setAttribute('frontdoor-url', data.frontdoorUrl);
      } catch (err) {
        console.error('Lightning Out init error:', err);
      }
    }

    if (customElements.get('lightning-out-application')) {
      initTabs();
      init();
    } else {
      const check = setInterval(() => {
        if (customElements.get('lightning-out-application')) {
          clearInterval(check);
          initTabs();
          init();
        }
      }, 100);
    }
  </script>

</body>
</html>
