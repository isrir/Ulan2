<!DOCTYPE html>
<html lang="en" style="height:100%; width: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LWC Embed</title>
  <script src="https://lancashiredev--dev.sandbox.my.salesforce.com/lightning/lightning.out.latest/index.iife.prod.js"></script>
  <style>
  body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  box-sizing: border-box;
  }
  </style>
</head>
<body>
  <header id="siteHeader" role="banner" style="background:#254a5c;color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
    <div style="max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:14px;">
        <div style="width:48px;height:48px;background:#ffffff20;border-radius:6px;display:flex;align-items:center;justify-content:center;">
          <div style="width:32px;height:32px;background:#b71c23;border-radius:4px;box-shadow:inset 0 -2px 0 rgba(0,0,0,0.15);"></div>
        </div>
        <div style="line-height:1;">
          <div style="font-size:18px;font-weight:700;">University of</div>
          <div style="font-size:18px;margin-top:2px;">Lancashire</div>
        </div>
      </div>

      <div style="color:#d6e0e6;font-size:14px;">Students&nbsp;&nbsp;|&nbsp;&nbsp;Staff</div>
    </div>

    <nav style="border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06);">
      <div style="max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 20px;">
        <button style="background:#b71c23;color:#fff;border:none;padding:10px 18px;border-radius:3px;font-weight:600;cursor:pointer;">Open Days</button>
        <button id="tabProspectus" onclick="showTab('prospectus')" aria-controls="tabContentProspectus" style="background:transparent;color:#d6e0e6;border:none;padding:8px 12px;cursor:pointer;font-weight:600;border-radius:3px;">Prospectus Request</button>
        <div style="flex:1"></div>
      </div>
    </nav>

    <div id="tabsContainer" style="max-width:1200px;margin:0 auto;padding:18px 20px;">
      <div id="tabContentProspectus" role="region" style="display:block;background:#fff;padding:12px;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,0.04);">
        <!-- Flow and Lightning Out will be placed here so it lives inside the Prospectus tab -->
        <lightning-out-application
          id="loApp"
          app-id="1UsPu00000001iTKAQ"
          components="c-lwc-embed-flow">
        </lightning-out-application>

        <c-lwc-embed-flow id="flowComp" style="width: 100%;"></c-lwc-embed-flow>
      </div>
    </div>
  </header>

  <lightning-out-application
    id="loApp"
    app-id="1UsPu00000001iTKAQ"
    components="c-lwc-embed-flow">
  </lightning-out-application>

  <c-lwc-embed-flow id="flowComp" style="width: 101%;"></c-lwc-embed-flow>

  <script>
    var storename = 'sairam';

    async function init() {
      try {
        const flowComp = document.getElementById('flowComp');
        flowComp.name = storename;

        const loApp = document.getElementById('loApp');
        const response = await fetch('/api/guest-session');

        if (!response.ok) {
          throw new Error(`Session fetch failed: ${response.status}`);
        }

        const data = await response.json();
        loApp.setAttribute('frontdoor-url', data.frontdoorUrl);
      } catch (err) {
        console.error('Lightning Out init error:', err);
      }
    }

    if (customElements.get('lightning-out-application')) {
      init();
    } else {
      const check = setInterval(() => {
        if (customElements.get('lightning-out-application')) {
          clearInterval(check);
          init();
        }
      }, 100);
    }

    // Simple tab switching — keeps the flow inside the Prospectus tab
    function showTab(name) {
      const prospectus = document.getElementById('tabContentProspectus');
      const tabBtn = document.getElementById('tabProspectus');
      if (name === 'prospectus') {
        prospectus.style.display = 'block';
        tabBtn.style.color = '#fff';
        tabBtn.style.background = '#15424b';
      } else {
        prospectus.style.display = 'none';
        tabBtn.style.color = '#d6e0e6';
        tabBtn.style.background = 'transparent';
      }
    }

    // Default to showing the Prospectus tab so the flow is visible
    showTab('prospectus');
  </script>

</body>
</html>
