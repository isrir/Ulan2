<!DOCTYPE html>
<html lang="en" style="height:100%; width: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LWC Embed</title>
  <script type="text/javascript" async src="https://lancashiredev--dev.sandbox.my.salesforce.com/lightning/lightning.out.latest/index.iife.prod.js"></script>
  <style>
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7fa;
  }

  .app-shell {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }

  .tabs {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem;
    background: #ffffff;
    border-bottom: 1px solid #d1d5db;
  }

  .tab {
    border: none;
    background: transparent;
    color: #374151;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    cursor: pointer;
    font-size: 0.95rem;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .tab:hover {
    background: #f3f4f6;
  }

  .tab.active {
    background: #1f2937;
    color: #ffffff;
  }

  .panel {
    height: calc(100vh - 60px);
    overflow: hidden;
    padding: 1rem;
  }

  .hidden {
    display: none;
  }

  c-lwc-embed-flow,
  c-session-storage {
    display: block;
    width: 100%;
    height: 100%;
  }

  .session-panel {
    display: grid;
    gap: 1rem;
    height: 100%;
    background: #ffffff;
    border-radius: 0.75rem;
    padding: 1rem;
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
    overflow: auto;
  }

  .session-row {
    display: grid;
    gap: 0.5rem;
    grid-template-columns: 140px 1fr;
    align-items: start;
  }

  .session-label {
    font-weight: 600;
    color: #374151;
  }

  .session-actions {
    margin-top: auto;
  }

  .session-actions button {
    background: #1f2937;
    color: #ffffff;
    border: none;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    cursor: pointer;
  }

  .session-actions button:hover {
    background: #111827;
  }

  pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    background: #f3f4f6;
    padding: 0.75rem;
    border-radius: 0.5rem;
  }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="tabs" role="tablist">
      <button class="tab active" data-target="flowPanel" type="button">Flow</button>
      <button class="tab" data-target="sessionPanel" type="button">Session Storage</button>
    </div>

    <div class="panel" id="flowPanel">
      <c-lwc-embed-flow id="flowComp"></c-lwc-embed-flow>
    </div>

    <div class="panel hidden" id="sessionPanel">
      <div class="session-panel">
        <h2>Session Storage</h2>
        <div class="session-row">
          <span class="session-label">frontdoorUrl</span>
          <pre id="sessionFrontdoorUrl">(empty)</pre>
        </div>
        <div class="session-row">
          <span class="session-label">guestName</span>
          <span id="sessionGuestName">(empty)</span>
        </div>
        <div class="session-actions">
          <button id="clearSessionButton" type="button">Clear session storage</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const storename = 'sairam';
    const loApp = document.createElement('lightning-out-application');
    loApp.id = 'loApp';
    loApp.setAttribute('app-id', '1UsPu00000001iTKAQ');
    loApp.setAttribute('components', 'c-lwc-embed-flow');
    document.body.insertBefore(loApp, document.body.firstChild);

    function activateTab(targetId) {
      document.querySelectorAll('.panel').forEach(panel => {
        panel.classList.toggle('hidden', panel.id !== targetId);
      });
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.target === targetId);
      });
    }

    document.addEventListener('click', event => {
      const tab = event.target.closest('.tab');
      if (!tab) return;
      activateTab(tab.dataset.target);
    });

    async function init() {
      try {
        const flowComp = document.getElementById('flowComp');
        if (flowComp) {
          flowComp.name = storename;
        }

        const loApp = document.getElementById('loApp');
        const response = await fetch('/api/guest-session');

        if (!response.ok) {
          throw new Error(`Session fetch failed: ${response.status}`);
        }

        const data = await response.json();
        if (loApp) {
          loApp.setAttribute('frontdoor-url', data.frontdoorUrl);
        }

        try {
          sessionStorage.setItem('frontdoorUrl', data.frontdoorUrl);
          sessionStorage.setItem('guestName', storename);
          updateSessionPanel(data.frontdoorUrl, storename);
        } catch (sessionError) {
          console.warn('sessionStorage unavailable:', sessionError && sessionError.message ? sessionError.message : sessionError);
        }
      } catch (err) {
        console.error('Lightning Out init error:', err);
      }
    }

    if (customElements.get('lightning-out-application')) {
      init();
    } else {
      const check = setInterval(() => {
        if (customElements.get('lightning-out-application')) {
          clearInterval(check);
          init();
        }
      }, 100);
    }

    function updateSessionPanel(frontdoorUrl, guestName) {
      const urlEl = document.getElementById('sessionFrontdoorUrl');
      const nameEl = document.getElementById('sessionGuestName');
      if (urlEl) {
        urlEl.textContent = frontdoorUrl || '(empty)';
      }
      if (nameEl) {
        nameEl.textContent = guestName || '(empty)';
      }
    }

    document.getElementById('clearSessionButton')?.addEventListener('click', () => {
      sessionStorage.removeItem('frontdoorUrl');
      sessionStorage.removeItem('guestName');
      updateSessionPanel(null, null);
    });

    updateSessionPanel(sessionStorage.getItem('frontdoorUrl'), sessionStorage.getItem('guestName'));
  </script>
</body>
</html>
