<!DOCTYPE html>
<html lang="en"  >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LWC Embed</title>
  <script src="https://lancashiredev--dev.sandbox.my.salesforce.com/lightning/lightning.out.latest/index.iife.prod.js"></script>
  <style>  
    html , body {
      margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden; /* Prevents scrollbars entirely */
  box-sizing: border-box; /* Ensures padding/borders don't add to the size */
    }
    /* .flowRuntimeContent,
    .flowruntime-flow-container,
    .slds-scrollable_y,
    .forceFlowRuntimeBody,
    .runtime_platform_flow-flow-runtime-container {
      overflow: visible !important;
      overflow-y: visible !important;
      height: auto !important;
      max-height: none !important;
    } */
    /* c-lwc-embed-flow {
      display: block !important;
      height: auto !important;
      overflow: visible !important;
    } */
  </style>
</head>
<body>

  <lightning-out-application
    id="loApp"
    app-id="1UsPu00000001iTKAQ"
    components="c-lwc-embed-flow">
  </lightning-out-application>

  <c-lwc-embed-flow></c-lwc-embed-flow>

  <script>
    async function init() {
      try {
        const loApp = document.getElementById('loApp');
        const response = await fetch('/api/guest-session');

        if (!response.ok) {
          throw new Error(`Session fetch failed: ${response.status}`);
        }

        const data = await response.json();
        loApp.setAttribute('frontdoor-url', data.frontdoorUrl);
      } catch (err) {
        console.error('Lightning Out init error:', err);
      }
    }

    if (customElements.get('lightning-out-application')) {
      init();
    } else {
      const check = setInterval(() => {
        if (customElements.get('lightning-out-application')) {
          clearInterval(check);
          init();
        }
      }, 100);
    }
  </script>

</body>
</html>
