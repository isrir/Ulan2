<!DOCTYPE html>
<html lang="en" style="height:100%; width:100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LWC Embed</title>
  <script src="https://lancashiredev--dev.sandbox.my.salesforce.com/lightning/lightning.out.latest/index.iife.prod.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      font-family: 'Salesforce Sans', Arial, sans-serif;
    }
    .external-form {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 16px;
      background: #f4f6f9;
      border-radius: 8px;
      border: 1px solid #dddbda;
    }
    .external-form label {
      font-size: 14px;
      font-weight: 600;
      color: #3e3e3c;
      white-space: nowrap;
    }
    .external-form input {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #dddbda;
      border-radius: 4px;
      width: 250px;
      outline: none;
      transition: border 0.2s;
    }
    .external-form input:focus {
      border-color: #0070d2;
      box-shadow: 0 0 0 1px #0070d2;
    }
    .external-form button {
      padding: 8px 20px;
      background-color: #0070d2;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .external-form button:hover {
      background-color: #005fb2;
    }
    .external-form button:disabled {
      background-color: #c9c9c9;
      cursor: not-allowed;
    }
    #statusMsg {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 600;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <!-- ✅ Input + Button on external page -->
  <div class="external-form">
    <label for="personName">Person Name:</label>
    <input type="text" id="personName" placeholder="Enter person name" />
    <button id="createBtn" onclick="handleCreateRecord()">Create Record</button>
  </div>
  <p id="statusMsg"></p>

  <lightning-out-application
    id="loApp"
    app-id="1UsPu00000001iTKAQ"
    components="c-lwc-embed-flow">
  </lightning-out-application>

  <c-lwc-embed-flow style="width:101%;"></c-lwc-embed-flow>

  <script>
    function handleCreateRecord() {
      const name = document.getElementById('personName').value.trim();
      const statusMsg = document.getElementById('statusMsg');
      const btn = document.getElementById('createBtn');

      // Validate input
      if (!name) {
        statusMsg.style.color = 'red';
        statusMsg.textContent = '⚠️ Please enter a name before creating a record.';
        return;
      }

      // Get LWC element by tag name (id is blocked by Lightning Out 2)
      const lwcEl = document.querySelector('c-lwc-embed-flow');

      if (!lwcEl) {
        statusMsg.style.color = 'red';
        statusMsg.textContent = '❌ LWC component not found in DOM.';
        return;
      }

      if (typeof lwcEl.createRecord !== 'function') {
        statusMsg.style.color = 'red';
        statusMsg.textContent = '⏳ LWC not ready yet. Please wait and try again.';
        return;
      }

      // Disable button while processing
      btn.disabled = true;
      btn.textContent = 'Creating...';
      statusMsg.style.color = '#444';
      statusMsg.textContent = 'Creating record...';

      lwcEl.createRecord(name)
        .then(() => {
          statusMsg.style.color = 'green';
          statusMsg.textContent = `✅ Record created successfully for: ${name}`;
          document.getElementById('personName').value = '';
        })
        .catch((err) => {
          statusMsg.style.color = 'red';
          statusMsg.textContent = '❌ Error: ' + (err.body?.message || err.message || 'Something went wrong');
          console.error('Apex error:', err);
        })
        .finally(() => {
          btn.disabled = false;
          btn.textContent = 'Create Record';
        });
    }

    // Allow pressing Enter key on input
    document.getElementById('personName').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        handleCreateRecord();
      }
    });

    async function init() {
      try {
        const loApp = document.getElementById('loApp');
        const response = await fetch('/api/guest-session');

        if (!response.ok) {
          throw new Error(`Session fetch failed: ${response.status}`);
        }

        const data = await response.json();
        loApp.setAttribute('frontdoor-url', data.frontdoorUrl);
      } catch (err) {
        console.error('Lightning Out init error:', err);
      }
    }

    if (customElements.get('lightning-out-application')) {
      init();
    } else {
      const check = setInterval(() => {
        if (customElements.get('lightning-out-application')) {
          clearInterval(check);
          init();
        }
      }, 100);
    }
  </script>

</body>
</html>
