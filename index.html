<!DOCTYPE html>
<html lang="en" style="height:100%; width: 100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LWC Embed</title>
  <script type="text/javascript" async src="https://lancashiredev--dev.sandbox.my.salesforce.com/lightning/lightning.out.latest/index.iife.prod.js"></script>
  <style>
  body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  box-sizing: border-box;
  }
  </style>
</head>
<body>

  <lightning-out-application
    id="loApp"
    app-id="1UsPu00000001iTKAQ"
    components="c-lwc-embed-flow,c-session-storage">
  </lightning-out-application>

  <c-lwc-embed-flow id="flowComp" style="width: 101%;"></c-lwc-embed-flow>
  <c-session-storage id="sessionStorageComp"></c-session-storage>

  <script>
    var storename = 'sairam';

    async function init() {
      try {
        const flowComp = document.getElementById('flowComp');
        if (flowComp) flowComp.name = storename;

        const loApp = document.getElementById('loApp');
        const response = await fetch('/api/guest-session');

        if (!response.ok) {
          throw new Error(`Session fetch failed: ${response.status}`);
        }

        const data = await response.json();
        if (loApp) loApp.setAttribute('frontdoor-url', data.frontdoorUrl);

        // Persist frontdoor URL and a friendly name in sessionStorage
        try {
          sessionStorage.setItem('frontdoorUrl', data.frontdoorUrl);
          sessionStorage.setItem('guestName', storename);
          const sComp = document.getElementById('sessionStorageComp');
          if (sComp && typeof sComp.onSessionStored === 'function') {
            sComp.onSessionStored({ frontdoorUrl: data.frontdoorUrl, guestName: storename });
          } else if (sComp) {
            // If LWC isn't upgraded yet, dispatch an event it can listen for
            sComp.dispatchEvent(new CustomEvent('sessionstored', { detail: { frontdoorUrl: data.frontdoorUrl, guestName: storename }, bubbles: true }));
          }
        } catch (se) {
          console.warn('sessionStorage unavailable:', se && se.message ? se.message : se);
        }
      } catch (err) {
        console.error('Lightning Out init error:', err);
      }
    }

    if (customElements.get('lightning-out-application')) {
      init();
    } else {
      const check = setInterval(() => {
        if (customElements.get('lightning-out-application')) {
          clearInterval(check);
          init();
        }
      }, 100);
    }
  </script>

</body>
</html>
